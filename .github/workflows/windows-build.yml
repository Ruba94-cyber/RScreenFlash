name: Windows build validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          foreach ($path in @('tools\Measure-CaptureStartup.ps1', 'tools\Package-ReleaseCandidate.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error "$path`: $($_.Message)" }; exit 1 }
          }
      - name: Build and package Release x64 candidate
        shell: pwsh
        run: |
          & .\tools\Package-ReleaseCandidate.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: RScreenFlash-1.0.1-rc.1-windows-x64
          path: release-candidates/*
          if-no-files-found: error
          retention-days: 14
